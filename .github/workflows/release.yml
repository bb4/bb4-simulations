name: Build Installers

on:
  release:
    types: [ published ]

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Ensure WiX on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # windows-latest often already has WiX; only install if light.exe is missing.
          if (-not (Get-Command light -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress --limit-output
          }
          $wixBin = Get-ChildItem 'C:\Program Files*\WiX Toolset*\bin' -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $wixBin) {
            throw 'WiX Toolset bin directory not found after install'
          }
          Write-Host "Using WiX at $wixBin"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          & "$wixBin\light.exe" -? | Select-Object -First 1

      - name: Build installers
        shell: bash
        run: ./gradlew jpackageAllApps --no-daemon

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/jpackage/**/*.dmg
            build/jpackage/**/*.pkg
            build/jpackage/**/*.msi
            build/jpackage/**/*.exe
            build/jpackage/**/*.deb
            build/jpackage/**/*.rpm
