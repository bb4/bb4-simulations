name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  repository_dispatch:
    types: [ upstream-updated ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # AWT/Swing (OfflineGraphics, dialogs) needs a display; ubuntu runners are headless.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            xvfb-run -a ./gradlew clean build --refresh-dependencies --info
          else
            xvfb-run -a ./gradlew build --info
          fi

      - name: Publish SNAPSHOT
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publish
