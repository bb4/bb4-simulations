name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  repository_dispatch:
    types: [ upstream-updated ]

jobs:
  build:
    uses: bb4/.github/.github/workflows/bb4-ci.yml@main
    with:
      gradle-args: build
      publish: true
      use-xvfb: true
      publish-gradle-args: --max-workers=1 --no-parallel -Dorg.gradle.internal.network.retry.max.attempts=4 -Dorg.gradle.internal.network.retry.initial.backOff=8000 -Dorg.gradle.internal.publish.checksums.insecure=true
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
