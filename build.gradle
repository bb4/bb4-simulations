// bb4Libs.* accessors are valid version-catalog notation; the IDE inspection often
// false-positives them when sibling includeBuild composites are active (IDEA-361672).
//noinspection DependencyNotationArgument
dependencies {
    implementation 'org.scala-lang.modules:scala-parser-combinators_3:2.4.0'
    implementation 'org.scala-lang.modules:scala-parallel-collections_3:1.3.0'
    // Ensures RegexParsers/LExpressionParser resolve when tests run from IDEs or isolated JUnit workers
    testImplementation 'org.scala-lang.modules:scala-parser-combinators_3:2.1.0'
    implementation bb4Libs.gson
    implementation bb4Libs.vecmath
    implementation bb4Libs.expression
    implementation bb4Libs.sound
    implementation bb4Libs.optimization
    implementation bb4Libs.ui
    implementation bb4Libs.common
    implementation bb4Libs.math
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters += '-deprecation'
}

// Benchmarks of the simulations that call bb4-optimization (see docs/benchmarks.md).
// Pass options with -PbenchmarkArgs, for example:
//   ./gradlew benchmark -PbenchmarkArgs="--lib-version=2.0.0 --reps=1 --max-evals=5 --apps=trebuchet --algorithms=GENETIC_SEARCH"
def benchmarkArgsList = {
    def raw = project.findProperty('benchmarkArgs')
    raw ? raw.toString().trim().split(/\s+/).toList() : []
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the continuous bb4-optimization strategies on Snake and Trebuchet and records fitness ' +
            'for the library version on the classpath in docs/benchmarks.json and docs/benchmarks.md.'
    mainClass = 'com.barrybecker4.simulation.benchmark.BenchmarkMain'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = projectDir
    jvmArgs = ['-Xmx4g', '-ea']
    args = benchmarkArgsList()
    outputs.upToDateWhen { false }
}

tasks.register('runFractExpLocalized', JavaExec) {
    group = 'application'
    mainClass = 'com.barrybecker4.simulation.common.ui.SimulatorApp'
    args "-panel_class", "com.barrybecker4.simulation.fractalexplorer.FractalExplorer", "-locale", "VIETNAMESE"
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ["-ea"]
}

def static jvmArgsForApp(Map propMap) {
    ['-ea', "-Xmx${propMap.mx ?: '2048m'}"]
}

// add extra execution scripts
// The application is deployed to /build/distributions. Run scripts are in the bin directory.
// Additional script to run text version.
// It can take parameters like "panel_class com.barrybecker4.simulation.dice.DiceSimulator"
// Shared multi-panel launcher (not a single apps{} entry). Per-app start scripts for
// sierpinski/spirograph come from bb4.application via apps.put.
def createSimulatorApp = tasks.register('createSimulatorApp', CreateStartScripts) {
    mainClass = 'com.barrybecker4.simulation.common.ui.SimulatorApp'
    classpath = startScripts.classpath
    outputDir = startScripts.outputDir
    applicationName = 'bb4-simulator'
    defaultJvmOpts = ["-Xmx2048m"]
    dependsOn 'simulationJar'
}

afterEvaluate {
    // 23 jarMap publications each send a burst of PUTs (jar/sources/javadoc/scaladoc/pom/
    // checksums/metadata). Central returns 429 when those bursts are chained only ~10s apart.
    // Sonatype's guidance is to reduce request rate, not retry harder — space the uploads.
    def delayMs = (findProperty('bb4.sonatypePublishDelayMs') ?: '20000').toString().toLong()
    def sonatypePublishTasks = tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository)
            .matching { it.name.endsWith('ToBb4SonatypeRepository') }
            .toList()
            .sort { it.name }
    sonatypePublishTasks.eachWithIndex { task, idx ->
        if (idx == 0) {
            return
        }
        task.mustRunAfter(sonatypePublishTasks[idx - 1])
        task.doFirst {
            logger.lifecycle("Throttling Sonatype publish: sleeping ${delayMs}ms before ${task.name}")
            Thread.sleep(delayMs)
        }
    }
}

application.applicationDistribution.into('bin') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(createSimulatorApp)
    filePermissions {
        unix('755')
    }
}

